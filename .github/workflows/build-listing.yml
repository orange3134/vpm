name: Build Repo Listing
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['source.json', 'Website/**', 'scripts/build_listing.py', 'release-migrations.json', '.github/workflows/build-listing.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-listing:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect all tools from registered GitHub repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_listing.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
