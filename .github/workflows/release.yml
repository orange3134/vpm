name: Release Exporter
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching both package manifests (e.g. v0.2.2)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: exporter-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build all formats
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/is-draft; then
            test "$(cat /tmp/is-draft)" = true || { echo 'Published versions are immutable. Bump the version.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "MEISHI Pop Exporter $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
