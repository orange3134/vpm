<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ピピピ技研のVPMパッケージ配布ページ。VCCへの追加とMEISHI Pop Exporterへのリンク。">
  <title>ピピピ技研 VPM</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1><span class="wordmark">ピピピ技研</span> <span class="title-label">VPM</span></h1>
    <div class="repository-actions">
      <a class="button button-primary" href="vcc://vpm/addRepo?url=https%3A%2F%2Fvpm.pipipigiken.jp%2Fvpm.json">VCCに追加する</a>
      <div class="repository-url">
        <label for="repository">URL</label>
        <div class="copy-row">
          <input id="repository" type="text" readonly spellcheck="false" value="https://vpm.pipipigiken.jp/vpm.json">
          <button class="button" id="copy" type="button">コピー</button>
        </div>
        <p id="copy-status" role="status" aria-live="polite"></p>
      </div>
    </div>
    <section aria-labelledby="packages-heading">
      <h2 id="packages-heading">Packages</h2>
      <ul class="packages">
        <li><a class="package-link" href="https://github.com/orange3134/meishi-pop-exporter">MEISHI Pop Exporter<span aria-hidden="true">↗</span></a></li>
      </ul>
    </section>
    <footer>©️ 2026 <a href="https://orangejp.net/">orange</a>@pipipigiken</footer>
  </main>
</body>
</html>
